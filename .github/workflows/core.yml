name: core
on:
  push:
    branches: [main]
    paths: ['packages/**', 'apps/web/**', 'apps/extension/**', 'contracts/**', 'pnpm-lock.yaml']
  pull_request:
    paths: ['packages/**', 'apps/web/**', 'apps/extension/**', 'contracts/**', 'pnpm-lock.yaml']
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
